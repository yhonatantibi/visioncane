# Start this workflow manually after importing the repository into Codemagic.
# It needs no Apple signing credentials. Its unsigned iOS output is NOT installable.
workflows:
  android-demo:
    name: VisionCane 0.7.0 - Indoor scene prototype
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.47.7
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.cache/uv
        - $CM_BUILD_DIR/.visioncane/model-export
        - $CM_BUILD_DIR/assets/models
    scripts:
      - name: Restore verified source from ZIP
        script: |
          set -e
          python3 - <<'PY'
          import hashlib, json, shutil, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          with zipfile.ZipFile('VisionCane-0.7.0-source.zip') as z:
              manifest = json.loads(z.read('visioncane_app/SOURCE_MANIFEST.json'))
              if manifest['version'] != '0.7.0': raise ValueError('Wrong source version')
              files = manifest['sha256']
              if not 1 <= len(files) <= 500: raise ValueError('Invalid source manifest')
              verified = {}
              for name, checksum in files.items():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name: raise ValueError('Unsafe source path')
                  if path.parts[0] not in ['lib', 'test', 'tool', 'docs', 'assets', '.github'] and len(path.parts) != 1:
                      raise ValueError('Unexpected source folder')
                  if path.parts[0] in ['.git', '.visioncane']: raise ValueError('Unexpected private folder')
                  data = z.read('visioncane_app/' + name)
                  if hashlib.sha256(data).hexdigest() != checksum: raise ValueError('Corrupt source: ' + name)
                  verified[name] = data
              # Build workspace only: retain misplaced uploads in a backup, outside analysis.
              names = {PurePosixPath(name).name for name in files}
              for misplaced in root.glob('*.dart'):
                  if misplaced.name not in names: raise ValueError('Unknown misplaced source: ' + misplaced.name)
                  backup = root / '.visioncane/upload-backup' / misplaced.name
                  backup.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(misplaced), str(backup))
              for name, data in verified.items():
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              (root / 'SOURCE_MANIFEST.json').write_text(json.dumps(manifest, indent=2))
          print('Restored verified VisionCane 0.7.0 source and folder layout.')
          PY
      - name: Check project layout and native configuration
        script: |
          set -e
          node tool/check_layout.mjs
          node --test tool/native_config.test.mjs
          node --test tool/prepare_plugin.test.mjs
          python3 tool/build_indoor_model_test.py
      - name: Generate platform projects and resolve packages
        script: |
          flutter config --no-enable-swift-package-manager
          node tool/bootstrap.mjs
      - name: Analyze and test
        script: |
          set -e
          dart tool/domain_smoke.dart
          dart tool/spatial_smoke.dart
          dart tool/narration_smoke.dart
          flutter analyze
          flutter test --reporter expanded
      - name: Build and verify bundled indoor model with door category
        script: bash tool/prepare_models.sh android
      - name: Build installable Android demo
        script: flutter build apk --debug --build-number="${BUILD_NUMBER:-10}"
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - pubspec.lock
      - assets/models/model-build.json
  verify-mobile:
    name: VisionCane - verify Android and unsigned iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore verified source from ZIP
        script: |
          set -e
          python3 - <<'PY'
          import hashlib, json, shutil, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          with zipfile.ZipFile('VisionCane-0.7.0-source.zip') as z:
              manifest = json.loads(z.read('visioncane_app/SOURCE_MANIFEST.json'))
              if manifest['version'] != '0.7.0': raise ValueError('Wrong source version')
              files = manifest['sha256']
              if not 1 <= len(files) <= 500: raise ValueError('Invalid source manifest')
              verified = {}
              for name, checksum in files.items():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name: raise ValueError('Unsafe source path')
                  if path.parts[0] not in ['lib', 'test', 'tool', 'docs', 'assets', '.github'] and len(path.parts) != 1:
                      raise ValueError('Unexpected source folder')
                  if path.parts[0] in ['.git', '.visioncane']: raise ValueError('Unexpected private folder')
                  data = z.read('visioncane_app/' + name)
                  if hashlib.sha256(data).hexdigest() != checksum: raise ValueError('Corrupt source: ' + name)
                  verified[name] = data
              # Build workspace only: retain misplaced uploads in a backup, outside analysis.
              names = {PurePosixPath(name).name for name in files}
              for misplaced in root.glob('*.dart'):
                  if misplaced.name not in names: raise ValueError('Unknown misplaced source: ' + misplaced.name)
                  backup = root / '.visioncane/upload-backup' / misplaced.name
                  backup.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(misplaced), str(backup))
              for name, data in verified.items():
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              (root / 'SOURCE_MANIFEST.json').write_text(json.dumps(manifest, indent=2))
          print('Restored verified VisionCane 0.7.0 source and folder layout.')
          PY
      - name: Check native configuration tools
        script: node --test tool/native_config.test.mjs
      - name: Generate matching platform projects
        script: |
          flutter config --no-enable-swift-package-manager
          node tool/bootstrap.mjs
      - name: Analyze and test Flutter code
        script: |
          set -e
          flutter analyze
          flutter test --reporter expanded
      - name: Build Android Debug and Release for comparison
        script: |
          set -e
          bash tool/prepare_models.sh both
          flutter build apk --debug --build-number="${BUILD_NUMBER:-5}"
          flutter build apk --release --build-number="${BUILD_NUMBER:-5}"
      - name: Resolve iOS dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Compile iOS without signing
        script: |
          set -e
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/VisionCane-unsigned.zip
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-release.apk
      - pubspec.lock
      - ios/Podfile.lock
      - assets/models/model-build.json
      - build/ios/iphoneos/VisionCane-unsigned.zip
